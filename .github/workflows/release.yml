name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt pytest

      - name: Run tests
        run: python -m pytest tests -v

      - name: Build exe
        run: |
          python -c "from app_icon import ensure_icon; from pathlib import Path; ensure_icon(Path('assets/sayit.ico'))"
          $env:SAYIT_ONEFILE = "1"
          python -m PyInstaller --noconfirm sayit.spec

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" dist/Sedabot.exe \
            --title "Sedabot $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md
